<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de crisis</title>
<meta name="description" content="Dinámica interactiva en vivo de Ciudadanía Global 1: decisiones éticas en una farmacéutica global.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1419; --panel:#16202A; --panel2:#1C2935; --line:#2A3A48;
    --text:#ECF1F5; --muted:#A9B7C4; --dim:#7D8C9A;
    --alert:#FF5A4E; --amber:#FFB547; --teal:#3FD1B5; --blue:#6FA8FF;
    --a:#FF6B5E; --b:#5E9BFF; --c:#3FD1B5; --d:#FFC24D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

  .hud{display:flex;align-items:center;gap:28px;padding:14px 32px;background:#0A0F13;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;margin-right:auto}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--alert);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,78,.7)}70%{box-shadow:0 0 0 10px rgba(255,90,78,0)}100%{box-shadow:0 0 0 0 rgba(255,90,78,0)}}
  .role{font-size:13px;font-weight:600;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin-left:8px}
  .meter{display:flex;flex-direction:column;gap:6px;min-width:160px}
  .meter-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
  .meter-top b{color:var(--text);font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}

  main{flex:1;display:flex;justify-content:center;padding:32px 32px 48px}
  .stage{width:100%;max-width:1180px}
  .tag{display:inline-flex;padding:6px 12px;border-radius:6px;background:rgba(255,90,78,.12);color:var(--alert);font-size:14px;font-weight:600;letter-spacing:.06em}
  h1{font-size:clamp(36px,6vw,74px);line-height:1.03;margin:18px 0;font-weight:800;letter-spacing:-.01em}
  h2{font-size:clamp(26px,3.6vw,42px);line-height:1.12;margin:10px 0 14px;font-weight:800}
  .lead{font-size:clamp(18px,2vw,22px);line-height:1.5;color:var(--muted);max-width:62ch;margin:0 0 24px}
  .btn{border:0;border-radius:10px;padding:15px 24px;font-weight:700;font-size:18px;background:var(--amber);color:#1A1205}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

  .file{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin:6px 0 20px}
  .file p{margin:0;font-size:clamp(17px,1.8vw,21px);line-height:1.55}
  .file .q{margin-top:12px;font-weight:700;color:var(--amber)}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .timer{font-size:38px;font-weight:600;color:var(--muted);min-width:100px;text-align:right}
  .timer.low{color:var(--alert)}

  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .opt{position:relative;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:18px 18px 16px 72px;color:var(--text);min-height:112px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,opacity .2s}
  button.opt:hover{border-color:var(--muted)}
  .opt .k{position:absolute;left:16px;top:16px;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#0E1419}
  .opt .t{font-size:18px;line-height:1.4;font-weight:600}
  .opt .tally{display:flex;align-items:center;gap:10px;margin-top:auto}
  .opt .tb{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .opt .tb i{display:block;height:100%;width:0;transition:width .5s}
  .opt .pct{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:80px;text-align:right}
  .opt.mine{border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,181,71,.18)}
  .opt.win{border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,181,71,.18)}
  .opt.lose{opacity:.45}

  .status{margin:16px 0 0;font-size:17px;color:var(--muted)}
  .status b{color:var(--text)}
  .result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .card h3{margin:0 0 10px;font-size:14px;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .card p{margin:0;font-size:clamp(16px,1.7vw,19px);line-height:1.55}
  .card.real{border-color:rgba(255,90,78,.55);background:linear-gradient(180deg,rgba(255,90,78,.08),transparent 60%),var(--panel)}
  .card.real h3{color:var(--alert)}

  .controls{position:sticky;bottom:0;margin-top:28px;background:#0A0F13;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .controls .info{margin-right:auto;color:var(--muted);font-size:15px}
  .join{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
  .join .url{font-size:22px;font-weight:700;word-break:break-all;color:var(--amber)}
  .join canvas{width:100%;max-width:240px;height:auto;border-radius:10px;background:#ECF1F5}
  .waiting{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:20px;margin-top:10px}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .setup{background:var(--panel);border:1px solid var(--alert);border-radius:16px;padding:24px;line-height:1.6}
  .setup code{background:#0A0F13;padding:3px 8px;border-radius:6px;font-size:16px;word-break:break-all}
  .demo-note{background:rgba(255,181,71,.12);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:15px;margin-bottom:18px}

  .reveal-name{font-size:clamp(56px,10vw,120px);font-weight:800;letter-spacing:-.02em;margin:6px 0;color:var(--alert)}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  .stat b{display:block;font-size:42px;font-weight:800;color:var(--amber);line-height:1}
  .stat span{display:block;margin-top:10px;color:var(--muted);font-size:17px;line-height:1.45}
  table{width:100%;border-collapse:collapse;font-size:18px;margin:6px 0 20px}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:15px}
  td.n{font-variant-numeric:tabular-nums;font-weight:700}
  .debate{background:var(--amber);color:#1A1205;border-radius:16px;padding:24px 26px;font-size:clamp(20px,2.4vw,26px);font-weight:800;line-height:1.3}
  .sources{color:var(--dim);font-size:13px;line-height:1.6;margin-top:24px}

  @media (max-width:860px){
    .opts,.result,.stats,.join{grid-template-columns:1fr}
    .hud{gap:14px;padding:12px 16px}
    .meter{min-width:120px;flex:1}
    main{padding:20px 16px 40px}
    .opt{min-height:0}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header class="hud" aria-label="Indicadores de la empresa">
  <div class="brand"><span class="dot" aria-hidden="true"></span><span>Sala de crisis</span><span class="role" id="role"></span></div>
  <div class="meter"><div class="meter-top"><span>Ventas</span><b id="v-ventas">50</b></div><div class="bar"><div class="fill" id="f-ventas" style="background:var(--blue)"></div></div></div>
  <div class="meter"><div class="meter-top"><span>Reputación</span><b id="v-rep">70</b></div><div class="bar"><div class="fill" id="f-rep" style="background:var(--teal)"></div></div></div>
  <div class="meter"><div class="meter-top"><span>Riesgo legal</span><b id="v-riesgo">20</b></div><div class="bar"><div class="fill" id="f-riesgo" style="background:var(--alert)"></div></div></div>
</header>

<main><div class="stage" id="app"><div class="waiting"><span class="spinner"></span>Conectando...</div></div></main>

const TS = "__TS__";
const isDemo = !FIREBASE_CONFIG || !FIREBASE_CONFIG.databaseURL;
const isHost = new URLSearchParams(location.search).has("presentador");

function makeDemoBackend() {
  const KEY = "sala_crisis_demo_db";
  const listeners = [];
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const write = (db) => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} emit(); };
  const getPath = (db, path) => path.split("/").filter(Boolean).reduce((o, k) => (o == null ? undefined : o[k]), db);
  const setPath = (db, path, val) => {
    const parts = path.split("/").filter(Boolean); let o = db;
    for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== "object" || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
    const last = parts[parts.length - 1];
    if (val === null) delete o[last]; else o[last] = val === TS ? Date.now() : val;
  };
  function emit() { const db = read(); listeners.forEach((l) => l.cb(getPath(db, l.path) ?? null)); }
  window.addEventListener("storage", (e) => { if (e.key === KEY) emit(); });
  let uid; try { uid = sessionStorage.getItem("sala_uid"); } catch (e) {}
  if (!uid) { uid = "demo-" + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem("sala_uid", uid); } catch (e) {} }
  return {
    uid,
    async init() { return true; },
    listen(path, cb) { const l = { path, cb }; listeners.push(l); cb(getPath(read(), path) ?? null); return () => listeners.splice(listeners.indexOf(l), 1); },
    async update(obj) { const db = read(); Object.entries(obj).forEach(([p, v]) => setPath(db, p, v)); write(db); },
    async checkHost() { return true; }
  };
}

async function makeFirebaseBackend() {
  const V = "10.12.2";
  const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const dbMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
  const authMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const app = appMod.initializeApp(FIREBASE_CONFIG);
  const db = dbMod.getDatabase(app);
  const auth = authMod.getAuth(app);
  await authMod.signInAnonymously(auth);
  const conv = (v) => (v === TS ? dbMod.serverTimestamp() : v);
  return {
    uid: auth.currentUser.uid,
    listen(path, cb) { return dbMod.onValue(dbMod.ref(db, path), (s) => cb(s.val())); },
    async update(obj) { const o = {}; Object.entries(obj).forEach(([k, v]) => (o[k] = conv(v))); await dbMod.update(dbMod.ref(db), o); },
    async checkHost() { try { await dbMod.update(dbMod.ref(db), { "live/ping": dbMod.serverTimestamp() }); return true; } catch (e) { return false; } }
  };
}

}

function tally() {

function drawQR(el, url) {

  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect((c + m) * cell, (r + m) * cell, cell, cell);

  el.innerHTML = ""; el.appendChild(cv);
}
function startCountdown() {
  clearInterval(timerInt);

    if (!live.deadline || live.phase !== "vote") { el.textContent = ""; return; }

function optionsHTML(R, mode) {

      ${counts ? `<span class="tally"><span class="tb"><i style="background:${COLORS[i]};width:${p}%"></i></span><span class="pct">${t[i]} · ${p} %</span></span>` : ""}
    </${tag}>`;
  }).join("")}</div>`;
}

function resultHTML(R) {
  const chosen = live.chosen && live.chosen[live.round];
  if (!chosen || live.phase === "vote") return "";
  const o = R.options[KEYS.indexOf(chosen)];
  const real = live.phase === "reveal"
    ? `<div class="card real"><h3 class="mono">LO QUE OCURRIÓ EN LA REALIDAD</h3><p>${esc(R.real)} En este punto, la empresa real actuó como en la opción ${KEYS[R.realOption]}.</p></div>` : "";
  return `<div class="result"><div class="card"><h3 class="mono">EL COMITÉ ELIGIÓ LA OPCIÓN ${chosen}</h3><p>${esc(o.c)}</p></div>${real}</div>`;
}

function finalHTML() {
  const mine = metersFor(live.chosen, 3), real = realMeters();
  const rows = [["Ventas", "ventas"], ["Reputación", "rep"], ["Riesgo legal", "riesgo"]]
    .map(([l, k]) => `<tr><td>${l}</td><td class="n">${mine[k]}</td><td class="n" style="color:var(--alert)">${real[k]}</td></tr>`).join("");
  const path = ROUNDS.map((_, r) => (live.chosen && live.chosen[r]) || "-").join(" · ");
  return `<span class="tag mono">EXPEDIENTE DESCLASIFICADO</span>
    <p class="lead" style="margin:18px 0 0">La empresa era</p>
    <div class="reveal-name">Novartis</div>
    <p class="lead">Una de las farmacéuticas más grandes del mundo. En 2020 cerró dos de los acuerdos por corrupción más costosos de la industria.</p>
    <div class="stats">
      <div class="stat"><b>$678 M</b><span>por sobornos a médicos en EE. UU. mediante falsos programas de oradores (2002 a 2011).</span></div>
      <div class="stat"><b>$347 M</b><span>por pagos indebidos a profesionales de salud en Grecia, Vietnam y Corea del Sur.</span></div>
      <div class="stat"><b>$51 M</b><span>adicionales por usar fundaciones para cubrir copagos de pacientes y promover sus fármacos.</span></div>
    </div>
    <h2 style="font-size:30px">Su camino frente al de Novartis</h2>
    <table aria-label="Comparación de indicadores"><thead><tr><th>Indicador</th><th>Su comité</th><th>Novartis real</th></tr></thead>
    <tbody>${rows}<tr><td>Decisiones</td><td class="n">${path}</td><td class="n" style="color:var(--alert)">${ROUNDS.map((R) => KEYS[R.realOption]).join(" · ")}</td></tr></tbody></table>
    <div class="debate">Si ustedes hubieran sido el comité de ética, ¿qué medida concreta habría evitado este caso?</div>
    <p class="sources">Fuentes: Healthcare Dive (2020), "Novartis to pay $678M to settle claims over sham doctor events"; Van Bael &amp; Bellis (2020), "Novartis settles bribery charges under the Foreign Corrupt Practices Act"; U.S. Department of Justice y Securities and Exchange Commission (2020).</p>`;
}

function render() {
  renderMeters();
  const demo = isDemo ? `<div class="demo-note">Modo demo: funciona en pestañas del mismo navegador. Para jugar con otras personas, configura Firebase en el código.</div>` : "";
  if (isHost) renderHost(demo); else renderPlayer(demo);
  startCountdown();
}

function renderPlayer(demo) {
  if (live.phase === "lobby" || live.round < 0) {
    app.innerHTML = `${demo}<span class="tag mono">EXPEDIENTE CONFIDENCIAL</span>
      <h1>Ustedes dirigen una farmacéutica global.</h1>
      <p class="lead">Su nombre se mantiene en reserva hasta el final. En cada ronda votarás como parte del comité ejecutivo. Tu voto es anónimo.</p>
      <div class="waiting"><span class="spinner"></span>Esperando a que el presentador abra la primera ronda...</div>`;
    return;
  }
  if (live.phase === "final") { app.innerHTML = demo + finalHTML(); return; }
  const R = ROUNDS[live.round];
  let status = "";
  if (live.phase === "vote") status = myVote ? `Tu voto: <b>${myVote}</b>. Puedes cambiarlo hasta que se cierre la votación.` : "Toca una opción para votar.";
  else if (live.phase === "result") status = "Votación cerrada. Esperen la revelación...";
  app.innerHTML = `${demo}<div class="head"><div><span class="tag mono">${esc(R.tag)}</span><h2>${esc(R.title)}</h2></div><div class="timer mono" id="timer"></div></div>
    <div class="file"><p>${esc(R.context)}</p><p class="q">${esc(R.question)}</p></div>
    ${optionsHTML(R, "player")}
    <p class="status" role="status">${status}</p>
    ${resultHTML(R)}`;
  app.querySelectorAll("button.opt").forEach((b) => (b.onclick = () => castVote(b.dataset.k)));
}

function renderHost(demo) {
  if (be.notHost) {
    app.innerHTML = `<div class="setup"><h2 style="font-size:28px">Falta autorizar este navegador como presentador</h2>
      <p>En la consola de Firebase, abre <b>Realtime Database &gt; Datos</b> y crea esta entrada:</p>
      <p><code>config / hosts / ${esc(be.uid)}</code> con el valor <code>true</code></p>
      <p>Luego recarga esta página.</p></div>`;
    return;
  }
  const t = tally(), total = t.reduce((a, b) => a + b, 0);
  let body = "", actions = "";
  if (live.phase === "lobby" || live.round < 0) {
    body = `<span class="tag mono">VISTA DEL PRESENTADOR</span><h1>Sala de crisis</h1>
      <p class="lead">Comparte este enlace o el código QR en el chat de la clase. Cuando todos estén dentro, abre la primera ronda.</p>
      <div class="join"><div><p class="lead" style="margin:0 0 8px">Enlace para participantes</p><div class="url">${esc(participantURL())}</div>
      <div class="row" style="margin-top:16px"><button class="btn ghost" id="copy">Copiar enlace</button></div></div><div id="qr"></div></div>`;
    actions = `<button class="btn" data-act="open">Abrir ronda 1</button>`;
  } else if (live.phase === "final") {
    body = finalHTML();
    actions = `<button class="btn ghost" data-act="reset">Reiniciar dinámica</button>`;
  } else {
    const R = ROUNDS[live.round];
    body = `<div class="head"><div><span class="tag mono">${esc(R.tag)}</span><h2>${esc(R.title)}</h2></div><div class="timer mono" id="timer"></div></div>
      <div class="file"><p>${esc(R.context)}</p><p class="q">${esc(R.question)}</p></div>
      ${optionsHTML(R, "host")}${resultHTML(R)}`;
    if (live.phase === "vote") actions = `<button class="btn ghost" data-act="timer">Iniciar tiempo</button><button class="btn ghost" data-act="toggle">${showCounts ? "Ocultar conteo" : "Mostrar conteo"}</button><button class="btn" data-act="close">Cerrar votación</button>`;
    else if (live.phase === "result") actions = `<button class="btn" data-act="reveal">Revelar lo que pasó</button>`;
    else if (live.phase === "reveal") actions = `<button class="btn" data-act="next">${live.round < ROUNDS.length - 1 ? `Abrir ronda ${live.round + 2}` : "Desclasificar el expediente"}</button>`;
  }
  const info = live.phase === "vote" ? `Votos recibidos: <b>${total}</b>` : live.phase === "lobby" ? "Sala abierta" : "";
  app.innerHTML = `${demo}${body}<div class="controls"><span class="info">${info}</span>${actions}</div>`;
  const qr = document.getElementById("qr"); if (qr) drawQR(qr, participantURL());
  const copy = document.getElementById("copy");
  if (copy) copy.onclick = async () => { try { await navigator.clipboard.writeText(participantURL()); copy.textContent = "Enlace copiado"; } catch (e) { copy.textContent = "Copia el enlace manualmente"; } };
  app.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => hostAction(b.dataset.act, b)));
}

// ---------------------------------------------------------------------
// Acciones
// ---------------------------------------------------------------------
async function castVote(k) {
  if (live.phase !== "vote") return;
  myVote = k; render();
  try { await be.update({ [`votes/r${live.round}/${be.uid}`]: k }); }
  catch (e) { const s = app.querySelector(".status"); if (s) s.textContent = "No se pudo registrar el voto. Intenta de nuevo."; }
}

async function hostAction(act, btn) {
  btn.disabled = true;
  try {
    if (act === "open") await be.update({ "live/round": 0, "live/rk": "r0", "live/phase": "vote", "live/deadline": null, "live/chosen": null });
    else if (act === "timer") await be.update({ "live/deadline": Date.now() + VOTE_SECONDS * 1000 });
    else if (act === "toggle") { showCounts = !showCounts; render(); return; }
    else if (act === "close") {
      const t = tally(); const max = Math.max(...t);
      const win = max === 0 ? null : KEYS[t.indexOf(max)];
      if (!win) { btn.disabled = false; alertNoVotes(); return; }
      await be.update({ "live/phase": "result", [`live/chosen/${live.round}`]: win, "live/deadline": null });
    }
    else if (act === "reveal") await be.update({ "live/phase": "reveal" });
    else if (act === "next") {
      const n = live.round + 1;
      if (n < ROUNDS.length) await be.update({ "live/round": n, "live/rk": "r" + n, "live/phase": "vote", "live/deadline": null });
      else await be.update({ "live/phase": "final", "live/rk": "" });
    }
    else if (act === "reset") { showCounts = false; await be.update({ votes: null, live: { round: -1, rk: "", phase: "lobby" } }); }
  } catch (e) {
    const info = app.querySelector(".controls .info"); if (info) info.textContent = "No se pudo actualizar. Revisa la conexión o los permisos.";
    btn.disabled = false;
  }
}

function alertNoVotes() {
  const info = app.querySelector(".controls .info");
  if (info) info.innerHTML = "Todavía no hay votos. Espera a que la clase vote.";
}

function subscribeVotes() {
  const rk = live.rk || "";
  if (subscribeVotes.rk === rk) return;
  subscribeVotes.rk = rk;
  if (unsubVotes) unsubVotes();
  votes = {};
  if (!rk) { unsubVotes = null; return; }
  unsubVotes = be.listen("votes/" + rk, (v) => {
    votes = v || {};
    if (!isHost) myVote = votes[be.uid] || null;
    render();
  });
}

(async function main() {
  document.getElementById("role").textContent = isHost ? "Presentador" : "Participante";
  try { be = isDemo ? makeDemoBackend() : await makeFirebaseBackend(); }
  catch (e) {
    app.innerHTML = `<div class="setup"><h2 style="font-size:28px">No se pudo conectar</h2><p>Revisa la configuración de Firebase y que el inicio de sesión anónimo esté activado.</p></div>`;
    return;
  }
  if (isHost) be.notHost = !(await be.checkHost());
  be.listen("live", (v) => {
    const prevRound = live.round;
    live = v || { round: -1, phase: "lobby" };
    if (typeof live.round !== "number") live.round = -1;
    if (live.round !== prevRound) myVote = null;
    subscribeVotes();
    render();
  });
})();
</script>
</body>
</html>
